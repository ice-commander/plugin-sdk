[package]
name = "sdk-hello-source"
version = "0.0.0"
edition = "2021"
description = "SDK example: a panel source of its own with panel actions"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-plugin-api = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["export-abi"]
export-abi = []

[dev-dependencies]
# The host table the plugin's own tests install behind it.
ic-plugin-api = { workspace = true, features = ["testing"] }
