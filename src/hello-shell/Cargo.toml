[package]
name = "sdk-hello-shell"
version = "0.0.0"
edition = "2021"
description = "SDK example: a connection with a terminal and changeable permissions"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ic-plugin-api = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["export-abi"]
export-abi = []
